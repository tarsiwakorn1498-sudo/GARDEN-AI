<!DOCTYPE html>
<html lang="th">
 
<head>
 
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
	<title>GARDEN AI | วิเคราะห์พรรณไม้</title>
 
	<link rel="stylesheet" href="style.css">
 
</head>
 
<body>
 
	<main class="hero">
 
    	<div class="hero-content">
 
        	<div class="logo">
            	GARDEN AI
        	</div>
 
        	<h2>🌿 AI วิเคราะห์พรรณไม้</h2>
 
        	<p>
            	อัปโหลดภาพพรรณไม้
            	แล้วให้ปัญญาประดิษฐ์ช่วยวิเคราะห์
        	</p>
 
        	<input
            	type="file"
            	id="imageInput"
            	accept="image/*"
        	>
 
        	<br><br>
 
        	<img
            	id="preview"
            	style="max-width:300px; display:none; border-radius:15px;"
        	>
 
        	<br><br>
 
        	<button
            	class="start-button"
                onclick="analyzeImage()"
        	>
            	🔍 วิเคราะห์ด้วย AI
        	</button>
 
        	<div id="loading"></div>
 
        	<div id="result"></div>
 
        	<br>
 
        	<a href="index.html">
            	← กลับหน้าหลัก
        	</a>
 
    	</div>
 
	</main>
 
 
	<!-- TensorFlow.js -->
	<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
 
	<!-- Teachable Machine -->
	<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
 
	<script src="script.js"></script>
 
</body>
 
</html>
